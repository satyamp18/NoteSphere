{% extends 'base.html' %}
{% block title %}Password Reset Complete - NoteSphere{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center min-vh-75 py-4">
    <div class="col-12 col-md-8 col-lg-5 text-center">
        <div class="card border-0 shadow-lg rounded-4 p-4 p-sm-5">
            <div class="metric-icon emerald mx-auto mb-3" style="width: 64px; height: 64px; font-size: 2rem;">
                <i class="fa-solid fa-circle-check"></i>
            </div>
            <h3 class="fw-bold mb-2">Password Reset Complete</h3>
            <p class="text-muted small mb-4">Your password has been successfully updated. You can now log in with your new password.</p>
            <a href="{% url 'accounts:login' %}" class="btn btn-primary rounded-pill px-4 fw-bold">Log In Now</a>
        </div>
    </div>
</div>
{% endblock %}
