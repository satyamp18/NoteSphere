{% extends 'base.html' %}
{% block title %}Email Sent - NoteSphere{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center min-vh-75 py-4">
    <div class="col-12 col-md-8 col-lg-5 text-center">
        <div class="card border-0 shadow-lg rounded-4 p-4 p-sm-5">
            <div class="metric-icon emerald mx-auto mb-3" style="width: 64px; height: 64px; font-size: 2rem;">
                <i class="fa-solid fa-paper-plane"></i>
            </div>
            <h3 class="fw-bold mb-2">Check Your Email</h3>
            <p class="text-muted small mb-4">We've emailed you instructions for setting your password, if an account exists with the email you entered.</p>
            <a href="{% url 'accounts:login' %}" class="btn btn-primary rounded-pill px-4 fw-bold">Return to Login</a>
        </div>
    </div>
</div>
{% endblock %}
