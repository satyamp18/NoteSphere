{% extends 'base.html' %}
{% block title %}Page Not Found (404) - NoteSphere{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center min-vh-75 py-4">
    <div class="col-12 col-md-8 col-lg-6 text-center">
        <div class="card border-0 shadow-lg rounded-4 p-5">
            <h1 class="display-1 fw-extrabold text-primary mb-0" style="font-size: 6rem;">404</h1>
            <h3 class="fw-bold mb-2">Page Not Found</h3>
            <p class="text-muted mb-4">The page or resource you are looking for doesn't exist or has been moved.</p>
            <div>
                <a href="{% url 'notes_app:dashboard' %}" class="btn btn-primary rounded-pill px-4 fw-bold">
                    <i class="fa-solid fa-house me-2"></i> Return to Dashboard
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
