{% extends 'notes_app/base.html' %}
{% block content %}
<h2>{{ note.title }}</h2>
<p class="text-muted">{{ note.created_at }}</p>
{% if note.note_type == 'drawing' and note.drawing %}
  <img src="{{ note.drawing.url }}" class="img-fluid" />
{% else %}
  <div>{{ note.content|linebreaksbr }}</div>
{% endif %}

<a class="btn btn-secondary" href="{% url 'notes:edit' note.pk %}">Edit</a>
<a class="btn btn-danger" href="{% url 'notes:delete' note.pk %}">Delete</a>
{% endblock %}
