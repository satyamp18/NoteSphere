{% extends 'notes_app/base.html' %}
{% block content %}
<h2>Draw Note</h2>
<p>Use the canvas below to draw. When finished, click Save to store the drawing as a note.</p>

<div id="canvas-area">
  <canvas id="sketch" width="800" height="400" style="border:1px solid #ccc; background:white;"></canvas>
</div>

<form id="draw-form" method="post">
  {% csrf_token %}
  <div class="form-group">
    <label>Title</label>
    <input class="form-control" name="title" />
  </div>
  <div class="form-group">
    <label>Category</label>
    <select name="category" class="form-control">
      <option>Personal</option>
      <option>Work</option>
      <option>Ideas</option>
      <option>Sketch</option>
      <option>Other</option>
    </select>
  </div>
  <input type="hidden" name="image_base64" id="image_base64" />
  <button class="btn btn-primary" onclick="saveDrawing(event)">Save Drawing</button>
  <button class="btn btn-secondary" onclick="clearCanvas(event)">Clear</button>
</form>

{% block scripts %}
<script>
const canvas = document.getElementById('sketch');
const ctx = canvas.getContext('2d');
let drawing = false;
let prev = null;

canvas.addEventListener('mousedown', (e)=>{ drawing=true; prev = {x:e.offsetX,y:e.offsetY}; });
canvas.addEventListener('mouseup', ()=>{ drawing=false; prev=null; });
canvas.addEventListener('mousemove', (e)=>{
  if(!drawing) return;
  const cur = {x:e.offsetX,y:e.offsetY};
  ctx.beginPath();
  ctx.moveTo(prev.x, prev.y);
  ctx.lineTo(cur.x, cur.y);
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  ctx.stroke();
  prev = cur;
});

function saveDrawing(e){
  e.preventDefault();
  const data = canvas.toDataURL('image/png');
  document.getElementById('image_base64').value = data;
  document.getElementById('draw-form').submit();
}

function clearCanvas(e){ e.preventDefault(); ctx.clearRect(0,0,canvas.width,canvas.height); }
</script>
{% endblock %}
{% endblock %}
