{% extends 'base.html' %}
{% block title %}Delete Note - NoteSphere{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center min-vh-75 py-4">
    <div class="col-12 col-md-8 col-lg-5 text-center">
        <div class="card border-0 shadow-lg rounded-4 p-4 p-sm-5">
            <div class="metric-icon rose mx-auto mb-3" style="width: 64px; height: 64px; font-size: 2rem;">
                <i class="fa-solid fa-trash-can text-danger"></i>
            </div>
            <h3 class="fw-bold mb-2">Delete Note?</h3>
            <p class="text-muted small mb-4">Are you sure you want to delete <strong>"{{ note.title }}"</strong>? This action cannot be undone.</p>
            
            <form method="POST">
                {% csrf_token %}
                <div class="d-flex justify-content-center gap-3">
                    <a href="{% url 'notes_app:note_list' %}" class="btn btn-outline-secondary rounded-pill px-4">Cancel</a>
                    <button type="submit" class="btn btn-danger rounded-pill px-4 fw-bold">Yes, Delete</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
